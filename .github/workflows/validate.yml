name: Validate artifact package

on:
  push:
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "artifact_manifest.json"
      - "benchmark/**"
      - "docs/**"
      - "evidence/**"
      - "experiments/run_manifest.md"
      - "harness/**"
      - "paper/**"
      - "results/**"
      - "scripts/**"
      - "submissions/**"
      - "tests/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run validation
        run: python scripts/run_checks.py --mode validate
