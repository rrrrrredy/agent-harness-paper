name: Build paper PDF

on:
  push:
    paths:
      - "paper/**"
      - "submissions/**/paper/**"
      - "results/tables/experiment_summary.tex"
      - ".github/workflows/latex.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install LaTeX
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -name '*microsoft*' -o -name '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra \
            texlive-publishers

      - name: Build PDF
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode main.tex
          bibtex main
          pdflatex -interaction=nonstopmode main.tex
          pdflatex -interaction=nonstopmode main.tex

      - name: Build submission PDFs
        run: |
          set -euo pipefail
          for dir in \
            submissions/icse2027-nier/paper \
            submissions/saner2027-tool-demo/paper \
            submissions/saner2027-short-paper/paper
          do
            (cd "$dir" && pdflatex -interaction=nonstopmode main.tex)
          done

      - name: Upload PDF
        uses: actions/upload-artifact@v7
        with:
          name: agent-harness-paper-pdf
          path: paper/main.pdf

      - name: Upload submission PDFs
        uses: actions/upload-artifact@v7
        with:
          name: agent-harness-submission-pdfs
          path: |
            submissions/icse2027-nier/paper/main.pdf
            submissions/saner2027-tool-demo/paper/main.pdf
            submissions/saner2027-short-paper/paper/main.pdf
