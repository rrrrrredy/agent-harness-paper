name: Build paper PDF

on:
  push:
    paths:
      - "paper/**"
      - "results/tables/experiment_summary.tex"
      - ".github/workflows/latex.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra

      - name: Build PDF
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode main.tex
          bibtex main
          pdflatex -interaction=nonstopmode main.tex
          pdflatex -interaction=nonstopmode main.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: agent-harness-paper-pdf
          path: paper/main.pdf
